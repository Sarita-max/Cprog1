version: '3.9'
services:
  backend:
    build: ./backend
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-dev_super_secret_change_me}
      - DATABASE_URL=file:./dev.db
    ports:
      - "4000:4000"
    volumes:
      - ./backend/prisma:/app/prisma
      - backend-data:/app
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  backend-data:
